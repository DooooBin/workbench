<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>个人工作台</title>
<style>
  :root {
    --bg: #0f0f1a;
    --bg-card: #1a1a2e;
    --bg-card2: #232340;
    --bg-input: #2a2a45;
    --text: #e8e8f0;
    --text-muted: #9a9ab0;
    --text-dim: #6b6b85;
    --border: #2e2e4a;
    --brand: #ff6b35;
    --brand2: #f7931e;
    --accent: #00d4aa;
    --danger: #ff4d6a;
    --warn: #ffb020;
    --done: #4ade80;
    --tab-active: #ff6b35;
    --tab-inactive: #6b6b85;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 15px; line-height: 1.5; overflow-x: hidden;
  }
  body {
    max-width: 520px; margin: 0 auto; min-height: 100vh;
    padding-bottom: 60px; position: relative;
  }
  /* === 通用 === */
  .page { display: none; padding: 12px 14px 20px; animation: fadeIn .2s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card {
    background: var(--bg-card); border-radius: 12px; padding: 14px 16px;
    margin-bottom: 10px; border: 1px solid var(--border);
  }
  .card-title { font-size: 15px; font-weight: 600; margin: 0 0 10px; color: var(--text); }
  .card-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 9px 16px; border-radius: 8px; font-size: 14px;
    border: none; cursor: pointer; transition: all .15s; font-weight: 500;
    background: var(--bg-input); color: var(--text);
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:active { background: var(--brand2); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-tiny { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  input, textarea, select {
    width: 100%; background: var(--bg-input); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--brand); }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  .row-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    display: inline-block; padding: 3px 10px; border-radius: 12px;
    background: var(--bg-input); color: var(--text-muted); font-size: 12px;
  }
  .tag-brand { background: rgba(255,107,53,.15); color: var(--brand); }
  .tag-accent { background: rgba(0,212,170,.15); color: var(--accent); }
  .tag-warn { background: rgba(255,176,32,.15); color: var(--warn); }
  .tag-danger { background: rgba(255,77,106,.15); color: var(--danger); }
  .tag-done { background: rgba(74,222,128,.15); color: var(--done); }
  .empty { text-align: center; padding: 30px 20px; color: var(--text-dim); font-size: 14px; }
  .divider { height: 1px; background: var(--border); margin: 10px 0; }

  /* === 顶部 === */
  .top-bar {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg); padding: 14px 14px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .top-title { font-size: 17px; font-weight: 700; }
  .top-date { font-size: 12px; color: var(--text-muted); }
  .top-right { display: flex; gap: 8px; }

  /* === 提醒横幅 === */
  .alert-banner {
    padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px; animation: slideIn .3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
  .alert-danger { background: rgba(255,77,106,.12); border: 1px solid rgba(255,77,106,.35); color: var(--danger); }
  .alert-warn { background: rgba(255,176,32,.12); border: 1px solid rgba(255,176,32,.35); color: var(--warn); }
  .alert-info { background: rgba(0,212,170,.1); border: 1px solid rgba(0,212,170,.3); color: var(--accent); }
  .alert-brand { background: rgba(255,107,53,.12); border: 1px solid rgba(255,107,53,.35); color: var(--brand); }

  /* === 时间轴 === */
  .timeline-item {
    display: flex; gap: 12px; padding: 12px 14px; margin-bottom: 8px;
    background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border);
    position: relative;
  }
  .timeline-item.done { opacity: .45; }
  .timeline-item.done .tl-main-text { text-decoration: line-through; }
  .timeline-item.active { border-color: var(--brand); box-shadow: 0 0 0 1px rgba(255,107,53,.3); }
  .tl-time { font-size: 13px; color: var(--text-muted); min-width: 52px; padding-top: 1px; }
  .tl-body { flex: 1; }
  .tl-title { font-weight: 500; font-size: 14px; }
  .tl-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .tl-action { align-self: center; }

  /* === Tab 栏 === */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 520px; background: var(--bg-card);
    border-top: 1px solid var(--border); display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 8px 0 6px; font-size: 11px; color: var(--tab-inactive);
    cursor: pointer; transition: color .15s;
  }
  .tab.active { color: var(--tab-active); }
  .tab svg { width: 22px; height: 22px; margin-bottom: 2px; }

  /* === 周表 === */
  .week-grid { display: flex; flex-direction: column; gap: 6px; }
  .week-row { display: flex; gap: 4px; }
  .week-cell {
    flex: 1; min-height: 60px; background: var(--bg-card); border-radius: 8px;
    padding: 6px; font-size: 11px; border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 3px; cursor: pointer;
  }
  .week-cell.today { border-color: var(--brand); background: rgba(255,107,53,.08); }
  .week-day-head { text-align: center; font-weight: 600; font-size: 12px; color: var(--text); padding: 4px 0; }
  .wc-block { padding: 2px 5px; border-radius: 4px; font-size: 10px; line-height: 1.3; }
  .wc-fixed { background: var(--bg-input); color: var(--text-muted); }
  .wc-fitness { background: rgba(255,107,53,.15); color: var(--brand); }
  .wc-task { background: rgba(0,212,170,.12); color: var(--accent); }
  .wc-course { background: rgba(255,176,32,.15); color: var(--warn); }
  .wc-lesson { background: rgba(168,85,247,.15); color: #a855f7; }

  /* === 选题 === */
  .idea-card {
    background: var(--bg-card); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 8px; border: 1px solid var(--border); cursor: pointer;
  }
  .idea-card:active { background: var(--bg-card2); }
  .idea-title { font-weight: 500; font-size: 14px; margin-bottom: 4px; }
  .idea-meta { font-size: 11px; color: var(--text-dim); display: flex; gap: 6px; flex-wrap: wrap; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 16px 0 8px; display: flex; align-items: center; gap: 6px; }
  .section-title::before { content: ''; width: 3px; height: 14px; background: var(--brand); border-radius: 2px; }

  /* === 备课 === */
  .lesson-block { margin-bottom: 14px; }
  .lesson-block-title { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
  .lesson-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--bg-input); border-radius: 6px; margin-bottom: 5px; font-size: 13px;
  }
  .lesson-item .drag { color: var(--text-dim); cursor: move; }
  .library-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .lib-item {
    padding: 8px 10px; background: var(--bg-input); border-radius: 6px; cursor: pointer;
    font-size: 12px; border: 1px solid transparent;
  }
  .lib-item:active { border-color: var(--brand); }

  /* === 记录 === */
  .weight-row { display: flex; gap: 10px; }
  .weight-input { flex: 1; text-align: center; font-size: 20px; font-weight: 600; padding: 14px 10px; }
  .trend-strip { display: flex; gap: 4px; margin-top: 10px; }
  .trend-bar {
    flex: 1; background: var(--bg-input); border-radius: 3px; height: 40px; position: relative; overflow: hidden;
  }
  .trend-bar-fill {
    position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, var(--brand), var(--brand2));
    border-radius: 3px;
  }
  .trend-bar-label { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 9px; color: var(--text-dim); }
  .trend-bar-val { position: absolute; top: 2px; left: 0; right: 0; text-align: center; font-size: 9px; color: var(--text-muted); font-weight: 500; }

  /* === 弹窗 === */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-mask.show { display: flex; animation: maskIn .2s ease; }
  @keyframes maskIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg-card); border-radius: 16px 16px 0 0;
    padding: 18px 16px 24px; width: 100%; max-width: 520px;
    max-height: 85vh; overflow-y: auto; animation: sheetUp .25s ease;
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }
  .form-group { margin-bottom: 12px; }
  .form-label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; display: block; }

  /* === 周日复盘 === */
  .recap-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .recap-item { background: var(--bg-input); border-radius: 8px; padding: 12px; text-align: center; }
  .recap-num { font-size: 24px; font-weight: 700; color: var(--brand); }
  .recap-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* === 饮食窗口 === */
  .window-bar {
    height: 24px; background: var(--bg-input); border-radius: 12px; overflow: hidden; position: relative;
    border: 1px solid var(--border);
  }
  .window-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), #0ea5a0);
    border-radius: 12px; position: relative;
  }
  .window-fill::after {
    content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 4px;
    background: var(--warn); border-radius: 0 12px 12px 0;
  }
  .window-marker {
    position: absolute; top: -2px; width: 3px; height: 28px;
    background: var(--brand); border-radius: 2px;
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- ======= 底部 Tab ======= -->
<div class="tabbar" id="tabbar">
  <div class="tab active" data-tab="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
    今天
  </div>
  <div class="tab" data-tab="week">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    周表
  </div>
  <div class="tab" data-tab="ideas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
    选题
  </div>
  <div class="tab" data-tab="lesson">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>
    备课
  </div>
  <div class="tab" data-tab="log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"/><path d="M7 14l4-4 4 4 5-5"/></svg>
    记录
  </div>
</div>

<!-- ======= 顶部 ======= -->
<div class="top-bar">
  <div>
    <div class="top-title" id="pageTitle">今天</div><span style="font-size:10px;color:#ff6b35;border:1px solid #ff6b35;border-radius:4px;padding:1px 4px;margin-left:6px;vertical-align:middle;">v2</span>
    <div class="top-date" id="pageDate"></div>
  </div>
  <div class="top-right">
    <button class="btn btn-ghost btn-tiny" onclick="exportData()">导出</button>
    <button class="btn btn-ghost btn-tiny" onclick="document.getElementById('importInput').click()">导入</button>
    <input type="file" id="importInput" accept="application/json" style="display:none" onchange="importData(this)">
  </div>
</div>

<!-- ======= 今天（首页） ======= -->
<div class="page active" id="page-home">
  <div id="homeAlerts"></div>
  <div class="card" id="homeScheduleCard">
    <div class="card-title">今日时间轴</div>
    <div id="homeTimeline"></div>
  </div>
  <div id="homeTomorrow"></div>
</div>

<!-- ======= 周表 ======= -->
<div class="page" id="page-week">
  <div class="card">
    <div class="row-between">
      <div class="card-title" id="weekLabel"></div>
      <div class="row-wrap" style="gap:6px;">
        <span class="tag wc-fixed">固定块</span>
        <span class="tag wc-fitness">健身</span>
        <span class="tag wc-task">任务</span>
        <span class="tag wc-course">跳绳课</span>
        <span class="tag wc-lesson">搏击课</span>
      </div>
    </div>
  </div>
  <div class="week-grid" id="weekGrid"></div>
</div>

<!-- ======= 选题库 ======= -->
<div class="page" id="page-ideas">
  <div class="card">
    <div class="row-between">
      <div>
        <div class="card-title">储备 <span id="ideaCount" style="color:var(--brand)"></span></div>
        <div class="card-sub">灵感 <span id="ideaInspire" style="color:var(--text)"></span> · 脚本 <span id="ideaScript" style="color:var(--text)"></span> · 已发 <span id="ideaPublished" style="color:var(--text)"></span></div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openIdeaModal()">+ 新灵感</button>
    </div>
  </div>
  <div class="section-title">灵感</div>
  <div id="ideaList-inspire"></div>
  <div class="section-title">已写脚本</div>
  <div id="ideaList-script"></div>
  <div class="section-title">已拍</div>
  <div id="ideaList-shot"></div>
  <div class="section-title">已发</div>
  <div id="ideaList-published"></div>
</div>

<!-- ======= 备课 ======= -->
<div class="page" id="page-lesson">
  <div class="card">
    <div class="row-between">
      <div class="card-title">本周教案（<span id="lessonWeekLabel"></span>）</div>
      <button class="btn btn-ghost btn-tiny" onclick="openHistoryModal()">历史课档</button>
    </div>
  </div>
  <div id="lessonCards"></div>
  <div class="section-title">内容库 <span id="libCount" style="font-weight:400;color:var(--text-dim);font-size:12px;"></span></div>
  <div class="card">
    <div class="row" style="margin-bottom:10px;">
      <button class="btn btn-tiny" id="libTabSkipping" onclick="switchLib('skipping')" style="background:var(--brand);color:#fff;">跳绳</button>
      <button class="btn btn-tiny" id="libTabFight" onclick="switchLib('fight')">搏击</button>
      <button class="btn btn-tiny btn-ghost" style="margin-left:auto;" onclick="openLibItemModal()">+ 新增</button>
    </div>
    <div id="libraryList"></div>
  </div>
</div>

<!-- ======= 记录 ======= -->
<div class="page" id="page-log">
  <div class="card">
    <div class="card-title">体重记录（<span id="logDateLabel"></span>）</div>
    <div class="weight-row">
      <div style="flex:1;">
        <div class="form-label" style="text-align:center;">早上 (kg)</div>
        <input type="number" step="0.1" class="weight-input" id="weightMorning" placeholder="--" onchange="saveWeight()">
      </div>
      <div style="flex:1;">
        <div class="form-label" style="text-align:center;">晚上 (kg)</div>
        <input type="number" step="0.1" class="weight-input" id="weightEvening" placeholder="--" onchange="saveWeight()">
      </div>
    </div>
    <div class="trend-strip" id="weightTrend"></div>
  </div>
  <div class="card">
    <div class="row-between">
      <div class="card-title" style="margin:0;">训练记录</div>
      <button class="btn btn-primary btn-tiny" onclick="openTrainingModal()">+ 加动作</button>
    </div>
    <div id="trainingList"></div>
  </div>
  <div class="card">
    <div class="card-title" style="margin-bottom:8px;">饮食（16+8 窗口 9:00–17:00）</div>
    <div class="window-bar" id="dietWindow"></div>
    <input type="text" id="dietNote" placeholder="今天吃了什么（一句话）..." style="margin-top:10px;" onchange="saveDiet()">
  </div>
  <div class="card">
    <div class="row-between" style="margin-bottom:8px;">
      <div class="card-title" style="margin:0;">睡眠</div>
      <span class="tag tag-accent" id="sleepDuration"></span>
    </div>
    <div class="row" style="gap:10px;">
      <div style="flex:1;">
        <div class="form-label">昨晚入睡时间</div>
        <input type="time" id="sleepTime" onchange="saveSleep()">
      </div>
      <div style="flex:1;">
        <div class="form-label">备注</div>
        <input type="text" id="sleepNote" placeholder="质量如何..." onchange="saveSleep()">
      </div>
    </div>
  </div>
  <div class="card" id="weekRecapCard" style="display:none;">
    <div class="card-title">本周训练复盘</div>
    <div id="weekRecap"></div>
  </div>
</div>

<!-- ======= 弹窗容器 ======= -->
<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
/* ============================================
   数据层：localStorage + 种子数据
   ============================================ */
const LS_KEY = 'workbench_v1';

const DEFAULT_DATA = {
  ideaCategories: ['学员趣事', '教练日常', '动作教学', '挑战', '反差'],
  ideaTemplates: [
    { name: '对标爆款结构·教学', hook: '3秒告诉你...', body: '动作拆解+常见错误', end: '关注我，下期教你...', shot: '健身房镜子前' },
    { name: '对标爆款结构·搞笑', hook: '你见过最惨的教练是...', body: '学员翻车实拍', end: '笑死了，点个赞吧', shot: '上课现场' },
  ],
  library: [
    // 跳绳基础
    { id: 'sk1', type: 'skipping', name: '并脚跳', points: '双脚并拢，手腕摇绳，前脚掌落地', scene: '热身 / 基础教学' },
    { id: 'sk2', type: 'skipping', name: '交替踏步跳', points: '左右脚轮流，像原地跑步', scene: '热身 / 节奏训练' },
    { id: 'sk3', type: 'skipping', name: '单脚跳', points: '单脚连续跳，左右轮换', scene: '平衡 / 进阶' },
    { id: 'sk4', type: 'skipping', name: '开合跳', points: '跳起分腿/并腿，配合摇绳', scene: '全身 / 热身' },
    { id: 'sk5', type: 'skipping', name: '高抬腿跳', points: '膝盖抬到腰，快节奏', scene: '有氧 / 爆发力' },
    { id: 'sk6', type: 'skipping', name: '前后跳', points: '并脚前后移动跳', scene: '协调性' },
    { id: 'sk7', type: 'skipping', name: '左右跳', points: '并脚左右移动跳', scene: '协调性' },

let DATA = loadData();

function loadData() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // 合并默认字段（兼容老版本）
      return Object.assign({}, DEFAULT_DATA, parsed);
    }
  } catch(e) {}
  // 首次加载
  const fresh = JSON.parse(JSON.stringify(DEFAULT_DATA));
  fresh.weekStart = getWeekKey(new Date());
  fresh.lessons = fresh.defaultLessons ? fresh.defaultLessons : [];
  return fresh;
}
function saveData() { localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }

/* ============================================
   工具函数
   ============================================ */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));

function pad(n) { return n<10 ? '0'+n : ''+n; }
function todayStr(d=new Date()) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function getWeekKey(d=new Date()) {
  // 周一为每周起始
  const date = new Date(d);
  const day = date.getDay() || 7;
  date.setDate(date.getDate() - day + 1);
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
}
function addDays(dateStr, n) {
  const d = new Date(dateStr);
  d.setDate(d.getDate()+n);
  return todayStr(d);
}
const WNAMES = ['周日','周一','周二','周三','周四','周五','周六'];

function weekKeyToDisplay(wk) {
  const d = new Date(wk);
  return `${d.getMonth()+1}月${d.getDate()}日 那周`;
}
function nowHour() { return new Date().getHours(); }
function nowMin() { return new Date().getMinutes(); }
function nowHM() { return pad(nowHour()) + ':' + pad(nowMin()); }

function genId(prefix='') { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ============================================
   周模板（固定每天的块）
   ============================================ */
function getWeekBlocks(weekKey) {
  const blocks = {};  // dateStr -> [ { id, time, title, desc, type('fixed'|'fitness'|'task'|'course'|'lesson'), checkinId } ]
  for (let i=0; i<7; i++) {
    const dateStr = addDays(weekKey, i);
    const d = new Date(dateStr);
    const dow = d.getDay(); // 0=周日
    const arr = [];

    // 工作日晨间
    if (dow >= 1 && dow <= 5) {
      arr.push({ id:'read', time:'07:00', title:'读经 + 送老婆', desc:'7:40 到家', type:'fixed', checkinId:'read' });
      arr.push({ id:'morning', time:'07:40', title:'听圣经 + 自重轻训练', desc:'动物流/俯卧撑/卷腹 + 做饭', type:'fixed', checkinId:'morning' });
    } else {
      arr.push({ id:'read', time:'07:00', title:'读经', desc:'周末不用送老婆', type:'fixed', checkinId:'read' });
    }

    // 饮食窗口
    arr.push({ id:'diet', time:'09:00–17:00', title:'进食窗口', desc:'16+8 断食', type:'fixed', checkinId:'diet' });

    // 固定课程
    if (dow === 4 || dow === 5) { // 周四、五
      arr.push({ id:'skipping', time:'17:00–18:20', title:'跳绳课', desc:'16:40 出门', type:'course', checkinId:'skipping' });
    }
    if (dow === 6 || dow === 0) { // 周六、日
      arr.push({ id:'fight1', time:'10:00–11:50', title:'搏击课 1', desc:'', type:'lesson', checkinId:'fight' });
      arr.push({ id:'fight2', time:'13:00–14:40', title:'搏击课 2', desc:'', type:'lesson', checkinId:'fight' });
      arr.push({ id:'fight3', time:'15:00–16:20', title:'搏击课 3', desc:'课后加餐', type:'lesson', checkinId:'fight' });
      arr.push({ id:'skipping', time:'17:00–18:20', title:'跳绳课', desc:'', type:'course', checkinId:'skipping' });
    }

    // 浮动健身（周一~周五上午/中午）
    if (dow >= 1 && dow <= 5) {
      const fitTime = DATA.fitnessTimes[dateStr];
      arr.push({ id:'fitness', time: fitTime || '待定', title:'健身', desc: '和朋友，练后拉伸 15min', type:'fitness', checkinId:'fitness' });
    }

    // 任务块（每天）
    if (dow !== 6 && dow !== 0) {  // 工作日学习+视频
      arr.push({ id:'study', time:'下午', title:'学习 1h', desc:'', type:'task', checkinId:'study' });
      arr.push({ id:'video', time:'下午/晚上', title:'视频 1h', desc:'写脚本/拍摄/剪辑', type:'task', checkinId:'video' });
    }

    // 周三下午：备课提醒
    if (dow === 3) {
      arr.push({ id:'lessonprep', time:'下午', title:'备课', desc:'本周跳绳+搏击教案', type:'task', checkinId:'lessonprep' });
    }

    blocks[dateStr] = arr;
  }
  return blocks;
}

const TAB_TITLES = { home:'今天', week:'周表', ideas:'选题库', lesson:'备课', log:'记录' };
$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const name = tab.dataset.tab;
    $$('.page').forEach(p => p.classList.remove('active'));
    $('#page-'+name).classList.add('active');
    $('#pageTitle').textContent = TAB_TITLES[name];
    render();
  });
});

/* ============================================
   今天（首页）
   ============================================ */
function renderHome() {
  const dateStr = todayStr();
  const weekBlocks = getWeekBlocks(DATA.weekStart);
  const todayBlocks = weekBlocks[dateStr] || [];
  const hour = nowHour();
  const alerts = [];

  // 提醒 1：选题不足
  const ideaTotal = DATA.ideas.filter(i => i.status === 'inspire' || i.status === 'script').length;
  if (ideaTotal < 8) alerts.push({ type:'warn', icon:'💡', text:`选题储备 ${ideaTotal}/8，该收灵感了` });

  // 提醒 2：学习未打卡（21:00 后）
  if (hour >= 21) {
    if (!DATA.checkins[dateStr]?.study) alerts.push({ type:'danger', icon:'⚠️', text:'学习 1h 还没打卡！' });
  }
  // 提醒 3：连续红灯（查过去两天）
  let missStreak = 0;
  for (let i=1; i<=3; i++) {
    const past = addDays(dateStr, -i);
    if (!DATA.checkins[past]?.study) missStreak++; else break;
  }
  if (missStreak >= 2) alerts.push({ type:'danger', icon:'🔴', text:`学习连续 ${missStreak} 天没打！强制中断了` });

  // 提醒 4：时间窗口
  if (hour >= 16 && hour < 17) alerts.push({ type:'warn', icon:'⏰', text:'窗口快关了，16:30 后别再吃了' });
  else if (hour >= 23) alerts.push({ type:'info', icon:'🌙', text:'该睡了，11点准时躺下' });
  else if (hour >= 9 && hour < 10) alerts.push({ type:'info', icon:'🍳', text:'进食窗口开启，9点了早饭吃吧' });

  // 提醒 5：周三下午备课
  const dow = new Date(dateStr).getDay();
  if (dow === 3 && hour >= 14) alerts.push({ type:'brand', icon:'📝', text:'该备课了，点这里去备课页' });

  // 渲染提醒
  $('#homeAlerts').innerHTML = alerts.map(a =>
    `<div class="alert-banner alert-${a.type}">${a.icon} ${a.text}</div>`
  ).join('');

  // 时间轴
  const checkins = DATA.checkins[dateStr] || {};
  $('#homeTimeline').innerHTML = todayBlocks.map(b => {
    const done = checkins[b.checkinId] && b.checkinId !== 'fitness';
    const nowH = nowHour();
    const nowActive = isBlockNowActive(b, nowH);
    return `
      <div class="timeline-item ${done?'done':''} ${nowActive?'active':''}">
        <div class="tl-time">${b.time}</div>
        <div class="tl-body">
          <div class="tl-title tl-main-text">${b.title}</div>
          ${b.desc ? `<div class="tl-desc">${b.desc}</div>` : ''}
        </div>
        ${b.checkinId && b.checkinId !== 'fitness' ? `
          <div class="tl-action">
            ${done ? `<span class="tag tag-done">✓</span>` : `<button class="btn btn-primary btn-tiny" onclick="doCheckin('${dateStr}','${b.checkinId}',this)">打卡</button>`}
          </div>
        ` : ''}
        ${b.id === 'fitness' && !DATA.fitnessTimes[dateStr] ? `
          <div class="tl-action">
            <button class="btn btn-tiny btn-ghost" onclick="setFitnessTime('${dateStr}')">定时间</button>
          </div>` : ''}
        ${b.id === 'fitness' && DATA.fitnessTimes[dateStr] && !checkins.fitness ? `

  }).join('') || '<div class="empty">今天没有排块</div>';

  // 排明天卡片
  $('#homeTomorrow').innerHTML = '';
  if (hour >= 20 && hour < 24) {
    const tomorrow = addDays(dateStr, 1);
    const tomBlocks = weekBlocks[tomorrow] || [];

  }
}

/* ============================================
   周表
   ============================================ */
function renderWeek() {
  const wk = DATA.weekStart;
  const start = new Date(wk);
  $('#weekLabel').textContent = `${start.getMonth()+1}月${start.getDate()}日 – ${start.getMonth()+1}月${start.getDate()+6}日`;

  const blocks = getWeekBlocks(wk);
  const todayDate = todayStr();
  const rows = [];

  // 第一行：表头
  let header = `<div class="week-row"><div class="week-day-head" style="min-width:52px;"></div>`;
  for (let i=0; i<7; i++) {
    const d = addDays(wk, i);
    const dow = new Date(d).getDay();
    const isToday = d === todayDate;
    const wname = ['一','二','三','四','五','六','日'][i];
    const mday = new Date(d).getDate();
    header += `<div class="week-day-head">${wname}<br><span style="${isToday?'color:var(--brand)':''}">${mday}</span></div>`;
  }
  header += `</div>`;
  rows.push(header);

  // 关键块类型，每种一行
  const ROW_TYPES = [
    { key:'morning', label:'晨间' },
    { key:'diet', label:'进食' },
    { key:'fitness', label:'健身' },
    { key:'study', label:'学习' },
    { key:'video', label:'视频' },
    { key:'skipping', label:'跳绳' },
    { key:'fight', label:'搏击' },
  ];

  ROW_TYPES.forEach(rowType => {
    let html = `<div class="week-row"><div style="width:52px;display:flex;align-items:center;font-size:12px;color:var(--text-muted);">${rowType.label}</div>`;
    for (let i=0; i<7; i++) {
      const d = addDays(wk, i);
      const bs = blocks[d] || [];
      const match = bs.filter(b => rowType.key === 'fight' ? b.checkinId === 'fight' : b.id === rowType.key);
      const cellClass = d === todayDate ? 'week-cell today' : 'week-cell';
      const fitTime = rowType.key === 'fitness' ? DATA.fitnessTimes[d] : null;
      let inner = '';
      match.forEach(b => {
        let cls = 'wc-fixed';
        if (b.type === 'fitness') cls = 'wc-fitness';
        else if (b.type === 'task') cls = 'wc-task';
        else if (b.type === 'course') cls = 'wc-course';
        else if (b.type === 'lesson') cls = 'wc-lesson';
        inner += `<div class="wc-block ${cls}">${fitTime || (rowType.key === 'fitness' ? '待定' : b.time.includes('–') ? '' : b.time)} ${b.title.replace('跳绳课','').replace('搏击课','').trim()}</div>`;
      });
      html += `<div class="${cellClass}" onclick="handleWeekCell('${d}','${rowType.key}')">${inner || '<span style="color:var(--text-dim);font-size:11px;">—</span>'}</div>`;
    }
    html += `</div>`;
    rows.push(html);
  });

  $('#weekGrid').innerHTML = rows.join('');
}

function handleWeekCell(dateStr, rowKey) {
  if (rowKey === 'fitness') setFitnessTime(dateStr);
  else {
    const isToday = dateStr === todayStr();
    if (isToday) render();
  }
}

    <div class="modal-head">
      <div class="modal-title">历史课档</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    ${hist.length === 0 ? '<div class="empty">还没归档过教案（每周日晚自动归档）</div>' : hist.slice().reverse().map(h => `
      <div class="idea-card" onclick="alert(JSON.stringify(h,null,2))">
        <div class="idea-title">${h.theme || '未填'} · ${h.type==='skipping'?'跳绳':'搏击'} · ${weekKeyToDisplay(h.weekKey)}</div>
        <div class="idea-meta">
          <span>拉伸 ${h.stretch?.length||0}</span>
          <span>热身 ${h.warmup?.length||0}</span>
          <span>教学 ${h.teach?.length||0}</span>
        </div>
      </div>
    `).join('')}
  `);
}

/* ============================================
   记录
   ============================================ */
function renderLog() {
  const dateStr = todayStr();
  $('#logDateLabel').textContent = dateStr + ' ' + WNAMES[new Date().getDay()];

  // 体重
  const w = DATA.weights[dateStr] || {};
  $('#weightMorning').value = w.morning || '';
  $('#weightEvening').value = w.evening || '';

  // 近 7 天趋势
  const trendData = [];
  for (let i=6; i>=0; i--) {
    const d = addDays(dateStr, -i);
    const rec = DATA.weights[d] || {};
    const v = rec.morning || rec.evening;
    trendData.push({ date: d.slice(8), val: v });
  }
  const vals = trendData.filter(t => t.val).map(t => t.val);
  const min = vals.length ? Math.min(...vals) - 1 : 0;
  const max = vals.length ? Math.max(...vals) + 1 : 100;
  $('#weightTrend').innerHTML = trendData.map(t => {
    if (!t.val) return `<div class="trend-bar" style="opacity:.3;"><div class="trend-bar-label">${t.date}</div></div>`;
    const pct = Math.max(8, Math.min(100, ((t.val - min) / (max - min)) * 100));
    return `<div class="trend-bar">
      <div class="trend-bar-label">${t.date}</div>
      <div class="trend-bar-fill" style="height:${pct}%;"></div>
      <div class="trend-bar-val">${t.val}</div>
    </div>`;
  }).join('');

  // 训练列表
  const trains = DATA.trainings[dateStr] || [];
  $('#trainingList').innerHTML = trains.length ? trains.map((t,i) => `
    <div class="lesson-item">
      <span class="tag tag-brand">${t.part}</span>
      <div style="flex:1;">
        <div style="font-weight:500;font-size:13px;">${t.name}</div>
      </div>
      <span style="color:var(--accent);font-weight:600;">${t.weight}kg</span>
      <button class="btn btn-tiny btn-ghost" onclick="removeTraining(${i})">删</button>
    </div>
  `).join('') : '<div class="empty" style="padding:14px;">今天还没记录训练</div>';

  // 饮食窗口
  const nowH = nowHour() + nowMin()/60;
  const windowStart = 9, windowEnd = 17;
  const pct = Math.max(0, Math.min(100, ((nowH - windowStart) / (windowEnd - windowStart)) * 100));
  const isOpen = nowH >= windowStart && nowH <= windowEnd;
  $('#dietWindow').innerHTML = `
    <div class="window-fill" style="width:${windowEnd===windowStart?100:((windowEnd-windowStart)/24*100)}%;"></div>
    ${isOpen ? `<div class="window-marker" style="left:calc(${pct}% - 1.5px);"></div>` : ''}
  `;
  $('#dietNote').value = DATA.diets[dateStr] || '';

  // 睡眠
  const s = DATA.sleeps[dateStr] || {};
  $('#sleepTime').value = s.time || '';
  $('#sleepNote').value = s.note || '';
  if (s.time) {
    const h = parseInt(s.time.split(':')[0]);
    const m = parseInt(s.time.split(':')[1]) || 0;
    const mins = (7 - ((h >= 12 ? h - 24 : h))) * 60 - m;
    const dur = Math.abs(mins) / 60;
    $('#sleepDuration').textContent = `约 ${dur.toFixed(1)} 小时`;
  } else {
    $('#sleepDuration').textContent = '待记录';
  }

  // 周日复盘
  if (new Date().getDay() === 0) {
    const weekBlocks = getWeekBlocks(DATA.weekStart);
    let fitnessCount = 0;
    const partCount = {};
    let totalActions = 0;
    for (let i=0; i<7; i++) {
      const d = addDays(DATA.weekStart, i);
      const t = DATA.trainings[d] || [];
      if (t.length > 0) fitnessCount++;
      t.forEach(item => {
        partCount[item.part] = (partCount[item.part] || 0) + 1;
        totalActions++;
      });
    }
    const lessonCount = Object.values(DATA.checkins).reduce((sum, day) => sum + (day.fight ? 3 : 0) + (day.skipping ? 1 : 0), 0);
    $('#weekRecapCard').style.display = '';
    $('#weekRecap').innerHTML = `
      <div class="recap-grid">
        <div class="recap-item"><div class="recap-num">${fitnessCount}</div><div class="recap-label">健身次数</div></div>
        <div class="recap-item"><div class="recap-num">${totalActions}</div><div class="recap-label">总动作数</div></div>
        <div class="recap-item"><div class="recap-num">${lessonCount}</div><div class="recap-label">上课节数</div></div>
        <div class="recap-item"><div class="recap-num">${Object.keys(partCount).length}</div><div class="recap-label">练过部位</div></div>
      </div>
      ${Object.keys(partCount).length ? `<div class="card-sub" style="margin-top:10px;">部位分布：${Object.entries(partCount).map(([k,v])=>`${k}×${v}`).join(' / ')}</div>` : ''}
    `;
  } else {
    $('#weekRecapCard').style.display = 'none';
  }
}

function saveWeight() {
  const dateStr = todayStr();
  DATA.weights[dateStr] = DATA.weights[dateStr] || {};
  DATA.weights[dateStr].morning = parseFloat($('#weightMorning').value) || null;
  DATA.weights[dateStr].evening = parseFloat($('#weightEvening').value) || null;
  saveData(); renderLog();
}
function saveDiet() {
  DATA.diets[todayStr()] = $('#dietNote').value;
  saveData();
}
function saveSleep() {
  DATA.sleeps[todayStr()] = {
    time: $('#sleepTime').value,
    note: $('#sleepNote').value,
  };
  saveData(); renderLog();
}

const PART_OPTIONS = ['胸', '背', '腿', '肩', '手臂', '核心', '全身'];
function openTrainingModal() {
  openModal(`
    <div class="modal-head">
      <div class="modal-title">+ 训练动作</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-group">
      <div class="form-label">部位</div>
      <select id="trPart">
        ${PART_OPTIONS.map(p => `<option>${p}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <div class="form-label">动作名称</div>
      <input id="trName" placeholder="例：卧推 / 深蹲 / 硬拉">
    </div>
    <div class="form-group">
      <div class="form-label">重量 (kg)</div>
      <input type="number" step="0.5" id="trWeight" placeholder="60">
    </div>
    <div class="row" style="gap:8px;">
      <button class="btn" onclick="closeModal()" style="flex:1">取消</button>
      <button class="btn btn-primary" style="flex:2" onclick="saveTraining()">保存</button>
    </div>
  `);
}
function saveTraining() {
  const name = $('#trName').value.trim();
  if (!name) return alert('填个动作名');
  const dateStr = todayStr();
  DATA.trainings[dateStr] = DATA.trainings[dateStr] || [];
  DATA.trainings[dateStr].push({
    part: $('#trPart').value,
    name,
    weight: parseFloat($('#trWeight').value) || 0,
  });
  saveData(); closeModal(); renderLog();
}
function removeTraining(idx) {
  const dateStr = todayStr();
  DATA.trainings[dateStr].splice(idx, 1);
  saveData(); renderLog();
}

/* ============================================
   导入导出
   ============================================ */
function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `工作台备份-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const json = JSON.parse(e.target.result);
      if (!confirm('导入会覆盖当前数据，确定吗？')) return;
      DATA = Object.assign({}, DEFAULT_DATA, json);
      saveData(); location.reload();
    } catch(err) {
      alert('文件读不了：' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ============================================
   弹窗底层
   ============================================ */
function openModal(html) {
  $('#modalContent').innerHTML = html;
  $('#modalMask').classList.add('show');
}
function closeModal() {
  $('#modalMask').classList.remove('show');
}

/* ============================================
   启动：跨周归档检查 + 初始渲染
   ============================================ */
function startupChecks() {
  const today = todayStr();
  const todayWeek = getWeekKey(new Date());

  // 跨周检测（周一 = 换周）
  if (todayWeek !== DATA.weekStart) {
    // 归档上周教案
    const lastWeekKey = DATA.weekStart;
    const lastWeekLessons = DATA.lessons.filter(l => l.weekKey === lastWeekKey);
    if (lastWeekLessons.length > 0 && !DATA.weekArchiveDone[lastWeekKey]) {
      DATA.lessonHistory = DATA.lessonHistory || [];
      lastWeekLessons.forEach(l => {
        DATA.lessonHistory.push({ ...l });
      });
      DATA.weekArchiveDone[lastWeekKey] = true;
    }
    DATA.weekStart = todayWeek;
    saveData();
  }

  // 内容库版本迁移：把新增的种子动作补进已有数据（已删掉的不会复活）
  const LIB_VERSION = 'v2';
  if (DATA.librarySeeded !== LIB_VERSION) {
    const exists = new Set(DATA.library.map(l => l.id));
    DEFAULT_DATA.library.forEach(l => {
      if (!exists.has(l.id)) DATA.library.push(JSON.parse(JSON.stringify(l)));
    });
    DATA.librarySeeded = LIB_VERSION;
    saveData();
  }

  // 首次启动，初始化一些种子检查
  if (!DATA.library.length) {
    DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
    DATA.weekStart = todayWeek;
    saveData();
  }
}

startupChecks();
render();

/* ============================================
   一些手动维护的 DOM 查询（某些地方用 $$ 有兼容问题）
   ============================================ */
function $$(sel, root=document) { return Array.from(root.querySelectorAll(sel)); }

</script>
